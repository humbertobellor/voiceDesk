                            - generic [ref=e269]:
                              - text: The math for data centers in space is insanely bad. It only makes sense for SpaceX, who would make tons of cash from it. Oh right… They’ve got an IPO coming up. Musk does not hesitate to exploit a conflict of interest. When stock price influences planning, craziness ensues. An Nvidia GB300 rack weighs about a ton and a half. Double that for support goo like shielding, assume SpaceX achieves a 100-ton payload, and you get 30ish racks per launch. 100 launches for a small data center. At least a hundred thousand launches to get close to the AI hypster's dreams. The racks will only be cutting-edge for a couple of years. So… 50,000 launches a year? SpaceX would be hugely profitable. But what goes up must come down. They’ll have to deorbit 50,000 a year, each weighing 100 tons-ish. This sounds less like a cleanup job than a kinetic weapon. Maybe the DoD would subsidize the scheme?
