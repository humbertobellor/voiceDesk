                              - generic [ref=e398]: 🔵 Humberto B. reposted this
                            - generic [ref=e399]:
                              - text: "Anthropic accidentally published the entire source code of Claude Code to a public registry. All 512,000 lines of it. A debugging file that should never have been included in the package got shipped to npm, and within 30 minutes the whole thing was mirrored on GitHub and being picked apart by thousands of developers. For those unfamiliar, Claude Code is Anthropic's flagship AI coding tool. It generates an estimated $2.5 billion in annual revenue, with 80% of that coming from enterprise customers. This is not a side project. This is the engine. Two things stand out to me here. One as a CIO, the other as a technology attorney. First, the security implications. The leaked code reveals exactly how Claude Code handles permissions, executes commands, coordinates multiple AI agents, and manages its security guardrails. That is a roadmap for bad actors. If you want to craft an attack that tricks the tool into running something it shouldn't, you now have the blueprints. Even worse, the leak happened on the same morning as a separate supply chain attack that planted malware in a popular npm package. If your team installed or updated Claude Code via npm early this morning, you should assume the worst and rotate your credentials immediately. For enterprise customers, this is a trust problem. You can build the most sophisticated AI architecture in the world, but if a missing line in your build configuration ships the whole thing to a public registry, none of that matters. Second, the copyright question. And this one is fascinating. Anthropic has publicly said that Claude Code essentially built their Cowork product. The leaked source even includes something called \"Undercover Mode\" that specifically hides AI authorship from public code commits. There is strong reason to believe that much of this codebase was written by AI. Under current U.S. copyright law, a work needs meaningful human authorship to qualify for protection. If this code was substantially generated by AI, Anthropic may not be able to enforce copyright over it at all. Competitors studying the leaked source might be looking at material that is, legally speaking, unprotectable. The irony is hard to miss. The most advanced AI coding tool in the world may have coded itself out of its own IP protection. This is the exact tension I wrote about back in 2018 in my article on AI and authorship. The law still hasn't caught up. Incidents like this are going to force the conversation. If you're evaluating AI coding tools for your organization, two practical takeaways: 1. Audit your AI vendor's software supply chain practices the same way you'd audit any critical infrastructure provider. 2. Start asking questions about the IP status of AI-generated code. Not just the code your teams produce, but the code inside the tools themselves."
