                            - generic [ref=e446]:
                              - text: "The proliferation of skill files targeting bioinformatics workflows (AI-generated and human-written alike) is growing fast, and so is the quality problem. Many lack validation, overstate what they can do, and use domain language without the required scientific rigour. Users who trust them uncritically risk results that appear sound but carry errors, a problem that extends to reproducibility as well. Crible is a small experimental tool I built to start addressing this: static quality assessment on bioinformatics skill files, flagging ambiguities, execution flow issues, and domain constraint violations before deployment. The underlying problem (LLM instruction sets with no quality gate) is not specific to bioinformatics. If you work with skill files, agent prompts, or structured LLM workflows in any technical field, this approach also applies. Early stage, honest about its limits, open source."
